# CaresynX MCP HTTP bridge — Nginx reverse proxy (on the same EC2 as the API).
#
# The GitHub workflow only deploys Node files to /opt/caresynx/mcp. It does NOT
# create DNS, TLS, or Nginx. Follow the steps in README.md (MCP bridge section).
#
# 1) DNS (GoDaddy): add A record  mcp  ->  44.210.107.247  (same host as api if shared)
# 2) Copy this file:
#      sudo cp nginx-mcp.caresynx.com.conf /etc/nginx/sites-available/mcp.caresynx.com
#      sudo ln -sf /etc/nginx/sites-available/mcp.caresynx.com /etc/nginx/sites-enabled/
# 3) Test and reload:
#      sudo nginx -t && sudo systemctl reload nginx
# 4) TLS:
#      sudo certbot --nginx -d mcp.caresynx.com
#
# 5) Ensure systemd unit caresynx-mcp is enabled and /opt/caresynx/mcp/.env exists.
#    Bridge must respond: curl -s http://127.0.0.1:8787/health

server {
    listen 80;
    listen [::]:80;
    server_name mcp.caresynx.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
