# CareSynX Home Care product UI — homecare.caresynx.com
#
# Deploy: .github/workflows/deploy-ui.yml → /var/www/homecare
# API:    https://api.homecare.caresynx.com/api/ (separate Nginx site)
#
# One-time on VPS:
#   sudo cp Scheduler.Client/eXtream-scheduler/deploy/nginx-homecare.caresynx.com.conf \
#     /etc/nginx/sites-available/homecare.caresynx.com
#   sudo ln -sf /etc/nginx/sites-available/homecare.caresynx.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d homecare.caresynx.com

server {
    listen 80;
    listen [::]:80;
    server_name homecare.caresynx.com;

    root /var/www/homecare;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
